{% extends "base.html" %}
{% block title %}确认订单{% endblock %}
{% block content %}
<h1 class="page-title">确认订单</h1>
<div class="checkout-layout">
  <section class="card">
    <h2>商品清单</h2>
    {% for item in items %}
    <div class="summary-item" data-testid="checkout-item">
      <span>{{ item.emoji }} {{ item.name }} × {{ item.qty }}</span>
      <span>¥{{ '%.2f'|format(item.subtotal) }}</span>
    </div>
    {% endfor %}
    <div class="summary-line total-line">应付金额 <strong data-testid="checkout-total">¥{{ '%.2f'|format(total) }}</strong></div>
  </section>

  <section class="card">
    <h2>收货信息</h2>
    <form method="post" data-testid="checkout-form">
      <label>收货人
        <input type="text" name="name" value="{{ user['username'] }}" data-testid="checkout-name">
      </label>
      <label>收货地址
        <input type="text" name="address" value="{{ user['address'] }}" data-testid="checkout-address">
      </label>
      <label>手机号
        <input type="text" name="phone" placeholder="6-15 位数字" data-testid="checkout-phone">
      </label>
      <input type="hidden" name="total" value="{{ '%.2f'|format(total) }}" data-testid="checkout-total-input">
      <button type="submit" class="btn btn-primary" data-testid="checkout-submit">提交订单并支付</button>
    </form>
  </section>
</div>
{% endblock %}
